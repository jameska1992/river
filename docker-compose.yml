services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: river
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-river}
      POSTGRES_DB: river
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U river"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Expose to host for local dev access — remove in production
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-river}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-river}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI

  # ---------------------------------------------------------------------------
  # Core API
  # ---------------------------------------------------------------------------

  river-api:
    build:
      context: ./river-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://river:${POSTGRES_PASSWORD:-river}@postgres:5432/river?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRY_MINUTES: ${JWT_ACCESS_EXPIRY_MINUTES:-15}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      MEDIA_BASE_PATH: /media
      # Least-privilege service account for the internal services. Seeded
      # (create-if-absent) on boot; the media services below authenticate
      # with it instead of the admin account. Defaults to the admin password
      # so existing deployments upgrade with no .env change; set SERVICE_PASSWORD
      # to give it a distinct secret.
      RIVER_SERVICE_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_SERVICE_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      RIVER_SCAN_URL: http://river-scan:8081
      RIVER_META_MOVIE_URL: http://river-meta-movie:8081
      RIVER_META_TV_URL: http://river-meta-tv:8082
      RIVER_META_BOOK_URL: http://river-meta-book:8083
      RIVER_META_MUSIC_URL: http://river-meta-music:8084
      # Radarr/Sonarr config now lives in the DB (admin Settings). It's
      # seeded from env on first boot by the river-init step below.
    volumes:
      - ${MEDIA_PATH:?MEDIA_PATH is required}:/media
      - ${OUTPUT_PATH:?OUTPUT_PATH is required}:/output:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8080:8080"

  # One-shot container that registers the admin user on first boot.
  # Exits 0 whether the user is created or already exists (409 is ignored).
  river-init:
    image: alpine:3.21
    restart: "no"
    depends_on:
      river-api:
        condition: service_healthy
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@river.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Seed values for the DB-backed integration settings. Applied only
      # on first boot when the corresponding setting is still unset;
      # afterwards the admin Settings UI is the source of truth.
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SUBDL_API_KEY: ${SUBDL_API_KEY:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-3600s}
      # Optional per-service API keys (service-role Phase 2). Set any of these
      # to a value starting with "rvk_" to provision a scoped key for that
      # service; the seed below is create-if-absent so it never clobbers a key
      # rotated via the admin UI. Leave unset to keep password auth.
      RIVER_SCAN_API_KEY: ${RIVER_SCAN_API_KEY:-}
      RIVER_VIDEO_TRANS_API_KEY: ${RIVER_VIDEO_TRANS_API_KEY:-}
      RIVER_AUDIO_TRANS_API_KEY: ${RIVER_AUDIO_TRANS_API_KEY:-}
      RIVER_META_MOVIE_API_KEY: ${RIVER_META_MOVIE_API_KEY:-}
      RIVER_META_TV_API_KEY: ${RIVER_META_TV_API_KEY:-}
      RIVER_META_BOOK_API_KEY: ${RIVER_META_BOOK_API_KEY:-}
      RIVER_META_MUSIC_API_KEY: ${RIVER_META_MUSIC_API_KEY:-}
    command:
      - sh
      - -c
      - |
        # 1. Register the admin user (a 409 "already exists" is fine).
        wget -qO/dev/null \
          --header="Content-Type: application/json" \
          --post-data="{\"username\":\"$$ADMIN_USERNAME\",\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\"}" \
          http://river-api:8080/api/auth/register || true

        # 2. Log in to obtain an admin access token.
        TOKEN=$$(wget -qO- \
          --header="Content-Type: application/json" \
          --post-data="{\"username\":\"$$ADMIN_USERNAME\",\"password\":\"$$ADMIN_PASSWORD\"}" \
          http://river-api:8080/api/auth/login \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

        # 3. Seed Radarr/Sonarr settings from env. The endpoint is
        #    set-if-absent, so this never clobbers values changed via the UI.
        wget -qO/dev/null \
          --header="Content-Type: application/json" \
          --header="Authorization: Bearer $$TOKEN" \
          --post-data="{\"radarr_url\":\"$$RADARR_URL\",\"radarr_api_key\":\"$$RADARR_API_KEY\",\"sonarr_url\":\"$$SONARR_URL\",\"sonarr_api_key\":\"$$SONARR_API_KEY\",\"tmdb_api_key\":\"$$TMDB_API_KEY\",\"subdl_api_key\":\"$$SUBDL_API_KEY\",\"scan_interval\":\"$$SCAN_INTERVAL\"}" \
          http://river-api:8080/api/admin/settings/integrations/seed || true

        # 4. Seed per-service API keys from env (create-if-absent). Scopes are
        #    derived server-side from each service name. Only non-empty keys are
        #    sent; the endpoint skips blanks and never clobbers existing keys.
        KEYS=""
        add_key() {
          [ -n "$$2" ] || return 0
          [ -n "$$KEYS" ] && KEYS="$$KEYS,"
          KEYS="$$KEYS{\"name\":\"$$1\",\"key\":\"$$2\"}"
        }
        add_key river-scan "$$RIVER_SCAN_API_KEY"
        add_key river-video-trans "$$RIVER_VIDEO_TRANS_API_KEY"
        add_key river-audio-trans "$$RIVER_AUDIO_TRANS_API_KEY"
        add_key river-meta-movie "$$RIVER_META_MOVIE_API_KEY"
        add_key river-meta-tv "$$RIVER_META_TV_API_KEY"
        add_key river-meta-book "$$RIVER_META_BOOK_API_KEY"
        add_key river-meta-music "$$RIVER_META_MUSIC_API_KEY"
        if [ -n "$$KEYS" ]; then
          wget -qO/dev/null \
            --header="Content-Type: application/json" \
            --header="Authorization: Bearer $$TOKEN" \
            --post-data="{\"keys\":[$$KEYS]}" \
            http://river-api:8080/api/admin/service-keys/seed || true
        fi

        echo "river-init complete"

  # ---------------------------------------------------------------------------
  # Media processing — all depend on river-init so the admin account exists
  # ---------------------------------------------------------------------------

  river-scan:
    build:
      context: ./river-scan
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_SCAN_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      # SCAN_INTERVAL now lives in river-api's settings store (seeded by
      # river-init on first boot); fetched at runtime, changeable via the UI.
      STATE_PATH: /state/scanner-state.json
    volumes:
      - ${MEDIA_PATH:?MEDIA_PATH is required}:/media:ro
      - scan_state:/state
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  river-video-trans:
    build:
      context: ./river-video-trans
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_VIDEO_TRANS_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      OUTPUT_DIR: /output
      WORKER_COUNT: ${VIDEO_TRANS_WORKERS:-2}
      NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ${MEDIA_PATH:?MEDIA_PATH is required}:/media:ro
      - ${OUTPUT_PATH:?OUTPUT_PATH is required}:/output
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # GPU device reservation is applied only via docker-compose.gpu.yml so the
    # base stack runs CPU-only (libx264). The transcoder falls back to CPU
    # automatically when NVENC isn't present.

  river-audio-trans:
    build:
      context: ./river-audio-trans
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_AUDIO_TRANS_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      OUTPUT_DIR: /output
      WORKER_COUNT: ${AUDIO_TRANS_WORKERS:-2}
    volumes:
      - ${MEDIA_PATH:?MEDIA_PATH is required}:/media:ro
      - ${OUTPUT_PATH:?OUTPUT_PATH is required}:/output
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  river-meta-movie:
    build:
      context: ./river-meta-movie
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_META_MOVIE_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      # TMDB key is fetched from river-api's settings store (seeded by the
      # river-init step from TMDB_API_KEY on first boot).
      WORKER_COUNT: ${META_WORKERS:-2}
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  river-meta-tv:
    build:
      context: ./river-meta-tv
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_META_TV_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      # TMDB key is fetched from river-api's settings store (seeded by the
      # river-init step from TMDB_API_KEY on first boot).
      WORKER_COUNT: ${META_WORKERS:-2}
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  river-meta-book:
    build:
      context: ./river-meta-book
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_META_BOOK_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      WORKER_COUNT: ${META_WORKERS:-2}
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  river-meta-music:
    build:
      context: ./river-meta-music
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2). When set, the
      # service authenticates with this scoped key instead of the shared
      # password; unset falls back to password login (non-destructive).
      RIVER_API_KEY: ${RIVER_META_MUSIC_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: river.media
      WORKER_COUNT: ${META_WORKERS:-2}
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Joins media.transcoded.* + media.enriched.* into media.ready.* on the
  # river.lifecycle exchange (reads records back from river-api). Foundation for
  # outbound webhooks + notifications.
  river-events:
    build:
      context: ./river-events
    restart: unless-stopped
    environment:
      RIVER_API_URL: http://river-api:8080
      RIVER_API_USERNAME: ${SERVICE_USERNAME:-river-service}
      RIVER_API_PASSWORD: ${SERVICE_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}}
      # Optional per-service API key (service-role Phase 2); unset → password auth.
      RIVER_API_KEY: ${RIVER_EVENTS_API_KEY:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-river}:${RABBITMQ_PASSWORD:-river}@rabbitmq:5672/
      WORKER_COUNT: ${META_WORKERS:-2}
    depends_on:
      river-init:
        condition: service_completed_successfully
      river-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Optional Discord notifier. Opt-in via the "discord" profile:
  #   docker compose --profile discord up -d
  # It receives River's outbound webhooks (#195) over HTTP — an admin must
  # create a webhook in river-api pointing at http://river-discord:8090/hooks/river,
  # copy its whsec_… secret into RIVER_DISCORD_WEBHOOK_SECRET, and mint a
  # read-only rvat_… token for RIVER_DISCORD_API_TOKEN. See river-discord/README.md.
  river-discord:
    build:
      context: ./river-discord
    restart: unless-stopped
    profiles: ["discord"]
    environment:
      RIVER_API_URL: http://river-api:8080
      # Read-only rvat_… API token (from admin → API Tokens) for embed lookups.
      RIVER_API_TOKEN: ${RIVER_DISCORD_API_TOKEN:-}
      # The whsec_… secret of the river-api webhook that targets this service.
      RIVER_WEBHOOK_SECRET: ${RIVER_DISCORD_WEBHOOK_SECRET:-}
      # Default Discord incoming-webhook URL (the channel to post to).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Optional JSON map of library-id OR media-type → Discord webhook URL.
      DISCORD_ROUTES: ${DISCORD_ROUTES:-}
      BATCH_WINDOW_SECONDS: ${DISCORD_BATCH_WINDOW:-10}
      NOTIFY_KINDS: ${DISCORD_NOTIFY_KINDS:-media.ready}
      PORT: "8090"
    depends_on:
      river-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8090/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------

  river-web:
    build:
      context: ./river-web
    restart: unless-stopped
    depends_on:
      river-api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  rabbitmq_data:
  scan_state:
